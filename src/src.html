<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FODMBCS Global Online Biblical & Theological Academy</title>
<meta name="description" content="Affordable, accessible and attainable Biblical and Theological education worldwide. Online courses, diplomas and certifications from Faith Open Door Ministries Bible College & Seminary, since 2016.">
<meta name="theme-color" content="#0F1B3D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1B3D'/%3E%3Cpath d='M32 14v36M22 26h20' stroke='%23C2952F' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B3D;--navy:#1B2E6B;--navy2:#24397F;--gold:#C2952F;--gold2:#E5C46F;--vellum:#F6F1E7;--vellum2:#EDE4D2;--paper:#FBF8F2;--text:#1A1F2E;--mute:#5B6275;--line:#E2DACA;--wine:#6E2533;--forest:#2B5246;
 --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --r:22px;--rs:14px;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--sh:0 30px 60px -30px rgba(15,27,61,.45)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:var(--sans);color:var(--text);background:var(--paper);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:min(1240px,calc(100% - 40px));margin:0 auto}
.skip{position:absolute;left:-999px;top:10px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:300}.skip:focus{left:12px}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.02;letter-spacing:-.01em;color:var(--ink)}
em{font-style:italic}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:600 12px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.eyebrow:before{content:"";width:28px;height:1.5px;background:currentColor}
.h2{font-size:clamp(38px,5vw,68px);margin:14px 0 18px}
.h2 em{color:var(--gold)}
.lead{font-size:1.12rem;color:var(--mute);max-width:58ch}
/* buttons */
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;font:600 15px var(--sans);letter-spacing:.02em;transition:color .45s var(--ease);white-space:nowrap}
.btn:after{content:"";position:absolute;z-index:-1;top:50%;left:50%;width:140%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(0);transition:transform .6s var(--ease)}
.btn:hover:after{transform:translate(-50%,-50%) scale(1)}
.btn .ico{transition:transform .45s var(--ease)}.btn:hover .ico{transform:translateX(5px)}
.btn-gold{background:var(--gold);color:var(--ink)}.btn-gold:after{background:#fff}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:after{background:var(--gold)}.btn-ink:hover{color:var(--ink)}
.btn-ghost{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55);color:#fff}.btn-ghost:after{background:#fff}.btn-ghost:hover{color:var(--ink)}
.btn-line{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}.btn-line:after{background:var(--ink)}.btn-line:hover{color:#fff}
.btn-sm{min-height:44px;padding:0 20px;font-size:14px}
.link{font-weight:600;color:var(--ink);background:linear-gradient(var(--gold),var(--gold)) 0 100%/0 2px no-repeat;transition:background-size .4s var(--ease);padding-bottom:2px}
.link:hover{background-size:100% 2px}
/* top bar */
.top{background:var(--ink);color:#C9D0E4;font-size:13px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:40px;gap:18px}
.top a{color:#fff}.top a:hover{color:var(--gold2)}
.top .r{display:flex;gap:20px}
@media(max-width:760px){.top .r{display:none}.top .wrap{justify-content:center}}
/* header */
.hdr{position:sticky;top:0;z-index:80;background:rgba(251,248,242,.92);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:transform .5s var(--ease),border-color .3s,box-shadow .3s}
body.scrolled .hdr{border-color:var(--line);box-shadow:0 10px 30px -24px rgba(15,27,61,.5)}
body.away .hdr{transform:translateY(-101%)}
.hdr .wrap{display:flex;align-items:center;gap:26px;height:86px}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand img{height:54px;width:auto;mix-blend-mode:multiply}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{position:relative;padding:10px 14px;font-weight:500;font-size:15px;color:var(--text);border-radius:10px}
.nav a:after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:1.5px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.nav a:hover:after,.nav a.on:after{transform:scaleX(1)}
.nav a.on{color:var(--ink);font-weight:600}
.tools{display:flex;align-items:center;gap:8px}
.ibtn{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.ibtn:hover{background:var(--vellum2)}
.ibtn .n{position:absolute;top:4px;right:2px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.ibtn.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.25) rotate(-8deg)}}
.burger{display:none}
.burger i{display:block;width:20px;height:1.8px;background:var(--ink);margin:4px auto;transition:transform .4s var(--ease),opacity .3s}
body.menu .burger i:nth-child(1){transform:translateY(5.8px) rotate(45deg)}body.menu .burger i:nth-child(2){opacity:0}body.menu .burger i:nth-child(3){transform:translateY(-5.8px) rotate(-45deg)}
.sheet{position:fixed;inset:0;z-index:70;background:var(--ink);color:#fff;padding:130px 28px 60px;overflow:auto;transform:translateY(-100%);transition:transform .75s var(--ease)}
body.menu .sheet{transform:none}
.sheet a{display:block;font:500 clamp(36px,9vw,64px)/1.15 var(--serif);opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease),color .2s;transition-delay:calc(var(--i)*45ms + .25s)}
body.menu .sheet a{opacity:1;transform:none}
.sheet a:hover{color:var(--gold2)}
.sheet small{display:block;margin-top:34px;color:#9AA4C2;font-size:14px}
@media(max-width:1060px){.nav,.hdr .hide-m{display:none}.burger{display:block}.hdr .wrap{height:74px}.brand img{height:46px}}
/* reveal */
[data-r]{opacity:0;transform:translateY(34px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:calc(var(--d,0)*90ms)}
[data-r].in{opacity:1;transform:none}
.wr .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.wr .w>span{display:inline-block;transform:translateY(110%) rotate(4deg);transition:transform 1.1s var(--ease);transition-delay:calc(var(--w)*70ms)}
.wr.in .w>span{transform:none}
.mask{border-radius:var(--r);overflow:hidden}
.mask img{clip-path:inset(0 0 100% 0);transform:scale(1.15);transition:clip-path 1.4s var(--ease),transform 1.8s var(--ease)}.mask.in img{clip-path:inset(0);transform:none}
/* hero */
.hero{position:relative;color:#fff;overflow:hidden;background:var(--ink)}
.hero .bg{position:absolute;inset:0}
.hero .bg img{width:100%;height:100%;object-fit:cover;opacity:.55;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-2%,-1%)}}
.hero .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(15,27,61,.96) 18%,rgba(15,27,61,.72) 52%,rgba(15,27,61,.35))}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:min(820px,calc(100vh - 126px));padding:80px 0 90px}
.hero .eyebrow{color:var(--gold2);animation:fade .9s var(--ease) .2s both}
.hero h1{color:#fff;font-size:clamp(50px,6.4vw,100px);font-weight:500;line-height:.95;margin:22px 0 26px;letter-spacing:-.02em}
.hero h1 em{color:var(--gold2);font-weight:500}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.hero h1 .w>span{display:inline-block;animation:rise 1.2s var(--ease) both;animation-delay:calc(.3s + var(--w)*90ms)}
@keyframes rise{from{transform:translateY(112%) rotate(5deg)}}
@keyframes fade{from{opacity:0;transform:translateY(20px)}}
.hero p.lead{color:#C9D0E4;font-size:1.18rem;animation:fade 1s var(--ease) 1s both}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px;animation:fade 1s var(--ease) 1.15s both}
.hero .facts{display:flex;gap:34px;margin-top:46px;padding-top:26px;border-top:1px solid rgba(255,255,255,.14);animation:fade 1s var(--ease) 1.3s both;flex-wrap:wrap}
.hero .facts b{display:block;font:600 34px/1 var(--serif);color:#fff}
.hero .facts span{font-size:13px;color:#9AA4C2;letter-spacing:.04em}
.stack{position:relative;height:520px;perspective:1400px}
.stack .bk{position:absolute;width:250px;left:50%;top:50%;animation:float 7s ease-in-out infinite}
.stack .bk:nth-child(1){transform:translate(-110%,-58%) rotate(-12deg);animation-delay:-2s}
.stack .bk:nth-child(2){transform:translate(-50%,-50%);z-index:2;width:280px}
.stack .bk:nth-child(3){transform:translate(12%,-40%) rotate(10deg);animation-delay:-4s}
@keyframes float{50%{translate:0 -16px}}
.stack .bk>div{animation:pop 1.2s var(--spring) both}
.stack .bk:nth-child(1)>div{animation-delay:.7s}.stack .bk:nth-child(2)>div{animation-delay:.9s}.stack .bk:nth-child(3)>div{animation-delay:1.1s}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(60px) rotateY(-40deg)}}
.seal{position:absolute;right:-6px;bottom:22px;width:150px;height:150px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;z-index:3;box-shadow:var(--sh);animation:fade 1s var(--ease) 1.4s both}
.seal svg{position:absolute;inset:6px;width:calc(100% - 12px);animation:spin 22s linear infinite}
.seal text{font:600 11.5px var(--sans);letter-spacing:.2em;fill:var(--ink)}
.seal b{font:600 34px/1 var(--serif)}
.seal small{position:absolute;bottom:42px;font-size:9px;font-weight:700;letter-spacing:.2em}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:980px){.hero .wrap{grid-template-columns:1fr;min-height:0;padding:60px 0 70px}.stack{height:400px}.stack .bk{width:200px}.stack .bk:nth-child(2){width:220px}.seal{width:120px;height:120px;right:0}}
/* book cover */
.book{position:relative;aspect-ratio:3/4.1;border-radius:4px 12px 12px 4px;transform-style:preserve-3d;box-shadow:var(--sh),inset 6px 0 0 rgba(0,0,0,.18),inset 9px 0 0 rgba(255,255,255,.06);overflow:hidden}
.book svg{width:100%;height:100%;display:block}
.book:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 60%);transform:translateX(-120%);transition:transform 1.2s var(--ease)}
/* ticker */
.tick{background:var(--gold);color:var(--ink);overflow:hidden;white-space:nowrap;padding:18px 0;font:600 clamp(20px,2.4vw,30px) var(--serif);font-style:italic}
.tick .tt{display:inline-flex;align-items:center;animation:tick 40s linear infinite}
.tick:hover .tt{animation-play-state:paused}
.tick span{padding:0 26px}
.tick i{width:14px;height:14px;background:var(--ink);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);flex:none}
@keyframes tick{to{transform:translateX(-25%)}}
/* sections */
.sec{padding:130px 0}
.sec.v{background:var(--vellum)}
.sec.dark{background:var(--ink);color:#C9D0E4}
.sec.dark h2,.sec.dark h3{color:#fff}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:56px;flex-wrap:wrap}
.head .lead{max-width:46ch}
/* mission */
.mission{font:500 clamp(34px,4.6vw,64px)/1.12 var(--serif);color:var(--ink);max-width:22ch;letter-spacing:-.01em}
.mission .mw{color:rgba(15,27,61,.16);transition:color .5s}
.mission .mw.on{color:var(--ink)}
.mission .mw.g.on{color:var(--gold)}
.mgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:70px;align-items:end}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.stats div{padding:26px 0 22px;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){border-right:1px solid var(--line);padding-right:20px}.stats div:nth-child(even){padding-left:24px}
.stats b{display:block;font:600 clamp(44px,5vw,68px)/1 var(--serif);color:var(--ink)}
.stats span{color:var(--mute);font-size:14px}
@media(max-width:900px){.mgrid{grid-template-columns:1fr;gap:40px}}
/* disciplines */
.disc{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dc{padding:34px 26px 38px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;overflow:hidden;transition:color .5s;isolation:isolate;min-height:330px;display:flex;flex-direction:column}
.dc:before{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleY(0);transform-origin:bottom;transition:transform .7s var(--ease);z-index:-1}
.dc:hover:before{transform:none}
.dc:hover{color:#C9D0E4}.dc:hover h3{color:#fff}
.dc .gl{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;margin-bottom:auto;transition:transform .8s var(--spring),background .4s,color .4s}
.dc:hover .gl{transform:rotate(-20deg) scale(1.08);background:var(--gold);color:var(--ink)}
.dc .gl .ico{width:26px;height:26px}
.dc small{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:40px}
.dc h3{font-size:30px;margin:8px 0 10px;transition:color .4s}
.dc p{font-size:14.5px;color:inherit;opacity:.85}
@media(max-width:1060px){.disc{grid-template-columns:1fr 1fr}.dc{min-height:260px}}
@media(max-width:560px){.disc{grid-template-columns:1fr}}
/* tiers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.tier{border-radius:var(--r);padding:38px 34px 34px;background:#fff;box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden;transition:transform .7s var(--spring),box-shadow .6s;display:flex;flex-direction:column}
.tier:hover{transform:translateY(-10px);box-shadow:0 0 0 1px var(--line),var(--sh)}
.tier .lv{display:flex;justify-content:space-between;align-items:center}
.tier .lv span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.tier .lv i{width:12px;height:12px;border-radius:50%}
.tier h3{font-size:40px;margin:22px 0 4px}
.tier .pr{font:600 64px/1 var(--serif);color:var(--ink);margin:18px 0 2px}
.tier .pr small{font:500 15px var(--sans);color:var(--mute);margin-left:6px}
.tier p{color:var(--mute);margin:14px 0 26px;flex:1}
.tier .cnt{font-size:13px;color:var(--mute);margin-bottom:18px}
.tier.dip{background:var(--ink);color:#C9D0E4;box-shadow:none}.tier.dip h3,.tier.dip .pr{color:#fff}.tier.dip p,.tier.dip .cnt,.tier.dip .pr small{color:#9AA4C2}
@media(max-width:900px){.tiers{grid-template-columns:1fr}}
/* course cards */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 18px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:14px;transition:background .3s,color .3s,box-shadow .3s}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chip small{opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:48px 26px}
.cc{display:flex;flex-direction:column;perspective:1200px}
.cc .bw{background:var(--vellum);border-radius:var(--r);padding:34px 40px 30px;display:grid;place-items:center;transition:background .5s}
.cc .book{width:100%;max-width:200px;transition:transform .9s var(--spring),box-shadow .6s}
.cc:hover .book{transform:rotateY(-18deg) rotateX(4deg) translateY(-8px)}
.cc:hover .book:after{transform:translateX(120%)}
.cc:hover .bw{background:var(--vellum2)}
.cc .meta{display:flex;justify-content:space-between;align-items:center;margin:20px 0 6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.cc .meta .p{font:600 24px var(--serif);letter-spacing:0;color:var(--ink)}
.cc h3{font-size:27px;line-height:1.08}
.cc h3 a:hover{color:var(--navy2)}
.cc p{color:var(--mute);font-size:14.5px;margin:10px 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cc .act{display:flex;gap:10px;align-items:center;margin-top:auto}
.add{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;transition:background .3s,color .3s}
.add:hover{background:var(--gold);color:var(--ink)}
.add.in{background:var(--forest)}
.add .ico{width:18px;height:18px;transition:transform .5s var(--spring)}.add:hover .ico{transform:rotate(90deg)}
.lvl-i{color:var(--navy2)}.lvl-d{color:var(--wine)}.lvl-c{color:var(--forest)}
/* split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.split .ph{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;position:relative}
.split .ph img{width:100%;height:100%;object-fit:cover}
.feat{display:grid;gap:0;margin-top:34px;border-top:1px solid var(--line)}
.feat div{display:grid;grid-template-columns:52px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}
.feat .gl{width:52px;height:52px;border-radius:50%;background:var(--vellum2);color:var(--navy);display:grid;place-items:center}
.feat b{font:600 22px/1.2 var(--serif);color:var(--ink);display:block}
.feat p{color:var(--mute);font-size:15px}
.badge{position:absolute;left:24px;bottom:24px;background:#fff;border-radius:16px;padding:16px 20px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;max-width:280px}
.badge .gl{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex:none}
.badge b{font-size:14px;display:block;line-height:1.3}.badge small{color:var(--mute);font-size:12.5px}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:44px}.split .ph{aspect-ratio:4/3.6}}
/* quote */
.quote{text-align:center;max-width:1000px;margin:0 auto}
.quote .mk{font:600 180px/.6 var(--serif);color:var(--gold);height:80px}
.quote blockquote{font:500 clamp(32px,4.2vw,58px)/1.12 var(--serif);color:#fff;letter-spacing:-.01em}
.quote blockquote em{color:var(--gold2)}
.quote .by{margin-top:34px;display:inline-flex;align-items:center;gap:16px;text-align:left}
.quote .by .av{width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:600 22px var(--serif)}
.quote .by b{color:#fff;display:block}.quote .by span{font-size:14px;color:#9AA4C2}
/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;counter-reset:s}
.step{position:relative;padding:36px 28px 34px;border-radius:var(--r);background:#fff;box-shadow:0 0 0 1px var(--line);transition:transform .7s var(--spring),box-shadow .5s,background .5s}
.step:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:var(--sh)}
.step .n{font:600 72px/.8 var(--serif);color:transparent;-webkit-text-stroke:1.2px var(--gold);display:block;margin-bottom:34px;transition:color .5s}
.step:hover .n{color:var(--gold)}
.step h3{font-size:28px;margin-bottom:10px}
.step p{color:var(--mute);font-size:15px}
.steps:before{content:"";position:absolute}

/* ===== v2 motion: 3D, scroll-driven, smooth ===== */
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
.prog{position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transform-origin:0 50%;transform:scaleX(0);z-index:200;pointer-events:none}
.curtain{position:fixed;inset:0;z-index:150;pointer-events:none;background:var(--ink);transform:translateY(100%)}
.curtain:after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--gold)}
.curtain.cover{transform:none;transition:none}
.curtain.off{transform:translateY(-100%);transition:transform .9s cubic-bezier(.76,0,.24,1)}
.curtain b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:italic 600 clamp(40px,6vw,80px) var(--serif);color:var(--gold2);white-space:nowrap;opacity:.9}
/* 3D reveal */
[data-r]{transform:perspective(1200px) translateY(46px) rotateX(14deg);transform-origin:50% 100%}
[data-r].in{transform:none}
.tilt{transform-style:preserve-3d;will-change:transform}
.tilt .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .4s;z-index:3;mix-blend-mode:soft-light}
.tilt:hover .glare{opacity:1}
.tier,.step,.card3,.cc .bw,.kpi{transform-style:preserve-3d;position:relative}
.tier.tilting,.step.tilting,.card3.tilting,.cc .bw.tilting{transition:transform .12s linear,box-shadow .5s!important}
/* parallax imgs */
[data-par]{overflow:hidden}
[data-par] img{will-change:transform;height:118%!important;margin-top:-9%}
/* hero 3D */
.stack{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease)}
.hero .wrap>div:first-child{will-change:transform,opacity;position:relative;z-index:3}
.hero .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none}
.hero .orb.a{width:420px;height:420px;background:#2C4BB0;left:-120px;top:20%;animation:orb 14s ease-in-out infinite alternate}
.hero .orb.b{width:360px;height:360px;background:#B88A2A;right:10%;bottom:-140px;animation:orb 18s ease-in-out infinite alternate-reverse}
@keyframes orb{to{transform:translate(80px,-60px) scale(1.15)}}
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold2);opacity:0;animation:dust linear infinite}
@keyframes dust{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-260px) translateX(40px)}}

let tickX=0,lastY=scrollY,vel=0;
function frame(){const y=scrollY,H=innerHeight,doc=document.documentElement.scrollHeight-H;
 vel+=((y-lastY)-vel)*.15;lastY=y;
 $("#prog").style.transform=`scaleX(${doc>0?y/doc:0})`;
 // hero exit
 const hero=$("#hero");if(hero){const r=hero.getBoundingClientRect();const p=clamp(-r.top/r.height);const c=hero.querySelector(".wrap>div:first-child");if(c){c.style.transform=`translateY(${p*140}px)`;c.style.opacity=1-p*.9}const bg=$("#heroBg");if(bg)bg.style.transform=`translateY(${p*30}%) scale(${1+p*.1})`;const hv=$("#hvis");if(hv)hv.style.translate=`0 ${p*-100}px`}
 // hero ring
 const hr=$("#hring");if(hr){const now=performance.now();const dt=Math.min(50,now-(hr._t||now));hr._t=now;if(!hr._drag)hr._ang=(hr._ang||0)-dt*.012-vel*.08;const narrow=innerWidth<560;const W=narrow?122:178,Hh=narrow?170:248;hr.style.setProperty("--W",W+"px");hr.style.setProperty("--H",Hh+"px");hr.style.setProperty("--R",(narrow?165:270)+"px");hr.style.setProperty("--ang",hr._ang+"deg");hr.style.setProperty("--tx",(-8+(hr._my||0)*-8)+"deg");
  let best=-2,bi=0;$$(".hb",hr).forEach((b,k)=>{const a=+b.dataset.a+hr._ang+(hr._mx||0)*10;const el=b.querySelector(".b3");lightBook(el,a);const c=Math.cos(a*Math.PI/180);if(c>best){best=c;bi=k}});
  if(hr._bi!==bi){hr._bi=bi;const c=CB[HERO3[bi]];$("#hlT").textContent=c.t;$("#hlM").textContent=LV[c.l].s+" · $"+c.p+" CAD"}
  $$(".hb .b3",hr).forEach(b=>{b.style.setProperty("--W",W+"px");b.style.setProperty("--H",Hh+"px");b.style.setProperty("--D",(narrow?28:40)+"px")})}
 // library ring
 const lib=$("#lib");if(lib){const r=lib.getBoundingClientRect();const p=clamp(-r.top/(r.height-H));const n=COURSES.length;const rot=-p*(n-1)*30;const ring=$("#ring");const R=innerWidth<760?330:600;ring.style.setProperty("--R",R+"px");ring.style.setProperty("--rot",rot+"deg");const k=Math.round(p*(n-1));$$(".rb",ring).forEach((b,i)=>{b.classList.toggle("dim",i!==k);lightBook(b.querySelector(".b3"),i*30+rot)});if(lib._k!==k){lib._k=k;const c=COURSES[k];$("#libT").textContent=c.t;$("#libM").textContent=LV[c.l].s+" · $"+c.p+" CAD";$("#libN").textContent=String(k+1).padStart(2,"0");$("#libA").setAttribute("href","#/course/"+c.id)}$("#libBar").style.width=(p*100)+"%"}
 // parallax
 $$("[data-par]").forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom<0||r.top>H)return;const p=(r.top+r.height/2-H/2)/H;const im=el.querySelector("img");if(im&&el.classList.contains("in"))im.style.transform=`translateY(${p*-8}%)`});
 // ticker by velocity
 const tt=$(".tick .tt");if(tt){tickX-=(.6+Math.abs(vel)*.25);const w=tt.scrollWidth/4;if(-tickX>w)tickX+=w;tt.style.transform=`translateX(${tickX}px) skewX(${clamp(vel*-.3,-8,8)}deg)`}
 const fm=$(".ftr .mark");if(fm){fm.style.animation="none";fm._x=(fm._x||0)-(.5+Math.abs(vel)*.2);const w=fm.scrollWidth/4;if(-fm._x>w)fm._x+=w;fm.style.transform=`translateX(${fm._x}px)`}
 const ph=$(".ph-head");if(ph){const p=clamp(y/400);ph.style.setProperty("--phx",(p*30)+"deg");ph.style.setProperty("--phy",(p*-20)+"deg")}
 requestAnimationFrame(frame)}
if(!RM)requestAnimationFrame(frame);
// pointer: hero tilt, card tilt, cursor
const cur=$("#cur");let cx=innerWidth/2,cy=innerHeight/2,tx=cx,ty=cy;
addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY;
 const hr=$("#hring");if(hr){hr._mx=(e.clientX/innerWidth)-.5;hr._my=(e.clientY/innerHeight)-.5;if(hr._drag){const dx=e.clientX-hr._px;hr._ang+=dx*.35;hr._moved=(hr._moved||0)+Math.abs(dx);hr._px=e.clientX}}
 const t=e.target.closest&&e.target.closest(".tier,.step,.card3,.cc .bw,.kpi");$$(".tilting").forEach(x=>{if(x!==t){x.classList.remove("tilting");x.style.transform=""}});
 if(t&&!RM&&e.pointerType==="mouse"){const r=t.getBoundingClientRect();const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;t.classList.add("tilting");t.style.transform=`perspective(900px) rotateX(${(.5-py)*10}deg) rotateY(${(px-.5)*12}deg) translateY(-6px)`;t.style.setProperty("--gx",px*100+"%");t.style.setProperty("--gy",py*100+"%");if(!t.querySelector(".glare")){const g=document.createElement("span");g.className="glare";t.appendChild(g)}}
 if(cur)cur.classList.toggle("big",!!(e.target.closest&&e.target.closest("a,button,.cc,.rb")))},{passive:true});
addEventListener("pointerdown",e=>{const sc=e.target.closest&&e.target.closest("#hscene");const hr=$("#hring");if(sc&&hr){hr._drag=true;hr._px=e.clientX;hr._moved=0}},{passive:true});addEventListener("pointerup",()=>{const hr=$("#hring");if(hr)setTimeout(()=>hr._drag=false,0)});
document.addEventListener("pointerleave",()=>$$(".tilting").forEach(x=>{x.classList.remove("tilting");x.style.transform=""}));
(function cloop(){cx+=(tx-cx)*.18;cy+=(ty-cy)*.18;if(cur)cur.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(cloop)})();
route();
</script>
